# Flume HDFS Sink - stores flight data in Hadoop
hdfs-sink.sources = kafka-source
hdfs-sink.channels = hdfs-channel
hdfs-sink.sinks = hdfs-sink

# ── Kafka Source ──────────────────────────────────────────────────────────────
hdfs-sink.sources.kafka-source.type = org.apache.flume.source.kafka.KafkaSource
hdfs-sink.sources.kafka-source.kafka.bootstrap.servers = kafka:29092
hdfs-sink.sources.kafka-source.kafka.topics = flight-tracking-hdfs
hdfs-sink.sources.kafka-source.kafka.consumer.group.id = flume-hdfs-consumer
hdfs-sink.sources.kafka-source.useFlumeEventFormat = false
hdfs-sink.sources.kafka-source.batchUpperLimit = 20000
hdfs-sink.sources.kafka-source.batchDurationMillis = 5000
hdfs-sink.sources.kafka-source.channels = hdfs-channel

# ── Interceptors ──────────────────────────────────────────────────────────────
# 1. Timestamp: inject event time into header
# 2. Cycle extractor: pull "cycle": N from JSON body → header {cycle}
hdfs-sink.sources.kafka-source.interceptors = ts-interceptor cycle-interceptor
hdfs-sink.sources.kafka-source.interceptors.ts-interceptor.type = timestamp
hdfs-sink.sources.kafka-source.interceptors.ts-interceptor.preserveExisting = false

hdfs-sink.sources.kafka-source.interceptors.cycle-interceptor.type = regex_extractor
hdfs-sink.sources.kafka-source.interceptors.cycle-interceptor.regex = \"cycle\":\\s*\"?(\\d+)\"?
hdfs-sink.sources.kafka-source.interceptors.cycle-interceptor.serializers = s1
hdfs-sink.sources.kafka-source.interceptors.cycle-interceptor.serializers.s1.name = cycle

# ── Memory Channel ────────────────────────────────────────────────────────────
hdfs-sink.channels.hdfs-channel.type = memory
hdfs-sink.channels.hdfs-channel.capacity = 300000
hdfs-sink.channels.hdfs-channel.transactionCapacity = 20000

# ── HDFS Sink ─────────────────────────────────────────────────────────────────
#
# File naming strategy:
#   One file per cycle:  flights_cycle-000007.log   (6-digit zero-padded)
#   Stored under:        /flight-data/YYYY-MM-DD/HH/
#
#   Lexicographic sort == ascending numeric sort because of zero-padding:
#     flights_cycle-000001.log
#     flights_cycle-000002.log
#     ...
#     flights_cycle-000042.log
#
# Roll strategy:
#   rollInterval = 0  → never roll by time
#   rollSize     = 0  → never roll by size
#   rollCount    = 0  → never roll by count
#   idleTimeout  = 10 → close file 10s after last event (1 cycle = ~5s, so 10s is safe)
#
# When cycle number changes in the filePrefix, Flume opens a NEW file automatically.
# The old file gets closed by idleTimeout → .tmp becomes .log
#
hdfs-sink.sinks.hdfs-sink.type = hdfs
hdfs-sink.sinks.hdfs-sink.hdfs.path = hdfs://namenode:8020/flight-data/%Y-%m-%d/%H/
hdfs-sink.sinks.hdfs-sink.hdfs.filePrefix = flights_cycle-%{cycle}
hdfs-sink.sinks.hdfs-sink.hdfs.fileSuffix = .log
hdfs-sink.sinks.hdfs-sink.hdfs.fileType = DataStream
hdfs-sink.sinks.hdfs-sink.hdfs.writeFormat = Text
hdfs-sink.sinks.hdfs-sink.hdfs.rollInterval = 0
hdfs-sink.sinks.hdfs-sink.hdfs.rollSize = 0
hdfs-sink.sinks.hdfs-sink.hdfs.rollCount = 0
hdfs-sink.sinks.hdfs-sink.hdfs.idleTimeout = 10
hdfs-sink.sinks.hdfs-sink.hdfs.batchSize = 20000
hdfs-sink.sinks.hdfs-sink.hdfs.useLocalTimeStamp = true
hdfs-sink.sinks.hdfs-sink.channel = hdfs-channel
