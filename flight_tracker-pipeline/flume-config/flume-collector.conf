# Flume Collector - يستقبل البيانات من OpenSky API
collector.sources = http-source
collector.channels = memory-channel
collector.sinks = kafka-sink

# HTTP Source (يستقبل بيانات الطائرات)
collector.sources.http-source.type = http
collector.sources.http-source.bind = 0.0.0.0
collector.sources.http-source.port = 44444
collector.sources.http-source.handler = org.apache.flume.source.http.JSONHandler
collector.sources.http-source.channels = memory-channel

# Memory Channel
collector.channels.memory-channel.type = memory
collector.channels.memory-channel.capacity = 500000
collector.channels.memory-channel.transactionCapacity = 20000

# Kafka Sink
# Uses defaultTopic as fallback. Each event's "topic" header overrides this per-event.
# Producer sends:
#   - Influx raw flights → topic header: "flight-tracking-raw"   (consumed by Spark → InfluxDB/Grafana)
#   - HDFS raw flights   → topic header: "flight-tracking-hdfs"  (consumed by HDFS Flume)
#   - Aggregates         → topic header: "flight-tracking"       (informational only, not consumed by Spark)
collector.sinks.kafka-sink.type = org.apache.flume.sink.kafka.KafkaSink
collector.sinks.kafka-sink.kafka.bootstrap.servers = kafka:29092
collector.sinks.kafka-sink.kafka.topic = flight-tracking-raw
collector.sinks.kafka-sink.topicHeader = topic
collector.sinks.kafka-sink.kafka.producer.acks = 1
collector.sinks.kafka-sink.useFlumeEventFormat = false
collector.sinks.kafka-sink.channel = memory-channel
